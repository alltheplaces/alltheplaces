[project]
name = "alltheplaces"
version = "0.0.0"
description = "A set of spiders ato extract location information from places that post their location on the internet."
requires-python = ">=3.11,<3.12"
dependencies = [
    "babel",
    "boto3",
    "brotli",
    "chompjs",
    "cryptography",
    "duckdb",
    "geonamescache",
    "geopandas",
    "ijson",
    "json5",
    "openpyxl",
    "pdfplumber",
    "phonenumbers",
    "phpserialize",
    "playwright_captcha",
    "psutil",
    "pyarrow",
    "pycountry",
    "pygeohash<4",
    "pygithub",
    "pyproj",
    "pyshp>=3.1.4",
    "python-json-logger",
    "requests",
    "requests-cache",
    "reverse-geocoder",
    "scrapy>=2.17.0",
    "scrapy-camoufox @ git+https://github.com/iandees/scrapy-camoufox.git",
    "scrapy-playwright>=0.0.48",
    "scrapy-zyte-api>=0.36.0",
    "shapely",
    "twisted[http2]",
    "tzdata",
    "unidecode",
    "xmltodict",
]


[[tool.uv.index]]
name = "pypi"
url = "https://pypi.python.org/simple"

[tool.uv]
# scrapy-camoufox pins camoufox<0.5.0, but camoufox 0.4.x installs whatever
# browser build is newest and breaks on v156.0.1-beta.33+ (#19411). From 0.5.x,
# `camoufox fetch` installs the browser build paired with the library version.
override-dependencies = ["camoufox[geoip]>=0.5.7"]

[tool.uv.sources]

[tool.black]
line-length = 120
target-version = ['py311']

[dependency-groups]
dev = [
    "autoflake8",
    "awscli",
    "black",
    "flake8",
    "isort",
    "pep8-naming",
    "pre-commit",
    "pylint",
    "pytest",
    "scrapy-lint>=0.1.1",
    "ty",
]

[tool.ty.rules]
incompatible-method-override = "ignore"
# Scrapy declares `parse: CallbackT`, so every `def parse` on a Spider subclass trips these
incompatible-attribute-override = "ignore"
incompatible-mutable-override = "ignore"

[tool.scrapy-lint]
known-settings = [
    "STATS_FILTER_LOCATED_IN_FAILED_MIN",
    "LOGSTATS_FILE",
]

# This list is checked by ci/check_scrapy_lint_exemptions.py which will some day be obsolete...
[tool.scrapy-lint.per-file-ignores]
"locations/__init__.py" = ["SCP27"]
"locations/commands/genspider.py" = ["SCP40"]
"locations/exporters/geojson.py" = ["SCP32"]
